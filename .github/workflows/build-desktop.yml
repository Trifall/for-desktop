name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release ref
        run: |
          RELEASE_TAG="${{ github.event.inputs.version || github.ref_name }}"
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing tag $RELEASE_TAG points to $TAG_SHA, not packaged commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi

  build-linux:
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull desktop assets
        run: |
          # Pull Stoat brand assets for desktop app (submodule with update=none)
          git -c submodule."assets".update=checkout submodule update --init assets

      - name: Checkout client repo
        if: ${{ !env.ACT }}
        uses: actions/checkout@v7
        with:
          repository: Trifall/stoat-for-web
          path: client
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check client directory exists
        shell: bash
        run: |
          if [ ! -d "client" ]; then
            echo "ERROR: client/ directory not found. For local testing with act, ensure client/ exists."
            echo "Run: git clone https://github.com/Trifall/stoat-for-web client"
            exit 1
          fi
          echo "client/ directory found"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js for web client
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          working_directory: client

      - name: Clean old builds
        run: |
          rm -rf client/packages/client/dist client/packages/client/dist-prod
          rm -rf client/packages/stoat.js/dist
          rm -rf client/packages/solid-livekit-components/dist

      - name: Install dependencies (Client)
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Pull brand assets
        working-directory: client
        run: |
          # Pull Stoat brand assets (submodule with update=none)
          git -c submodule."packages/client/assets".update=checkout submodule update --init packages/client/assets

      - name: Build dependencies
        working-directory: client
        run: |
          set -e
          mise build:deps

      - name: Copy audio assets
        run: |
          if [ -d "client/packages/client/scripts/assets_fallback/audio" ]; then
            mkdir -p "client/packages/client/assets/audio"
            cp -r "client/packages/client/scripts/assets_fallback/audio/"* "client/packages/client/assets/audio/"
            echo "Audio assets copied"
            cd client/packages/client
            node scripts/copyAssets.mjs
            cd ../../..
          fi

      - name: Process translations
        working-directory: client
        run: |
          # Compile lingui messages after lingui packages are built
          mise lingui:extract
          mise lingui:compile

      - name: Build web client
        working-directory: client
        env:
          VITE_CFG_ENABLE_VIDEO: "true"
          VITE_RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: mise build

      - name: Copy web assets to desktop
        run: |
          rm -rf web-dist
          mkdir -p web-dist
          cp -r client/packages/client/dist/* web-dist/

      - name: Setup Node.js for Electron Forge
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libx11-dev libxi-dev

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear desktop build output
        run: rm -rf .vite out/Stoat-linux-x64 out/make/zip/linux/x64

      - name: Build desktop app
        run: pnpm package --platform=linux --arch=x64

      - name: Create distributable ZIP
        run: pnpm make --platform=linux --arch=x64 --targets=zip --skip-package

      - name: Find ZIP file
        id: find-zip
        run: |
          shopt -s nullglob
          ZIP_FILES=(out/make/zip/linux/x64/*.zip)
          if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
            ZIP_FILE="${ZIP_FILES[0]}"
            INPUT_VERSION="${{ github.event.inputs.version }}"
            VERSION=${INPUT_VERSION:-${GITHUB_REF_NAME}}
            VERSION=${VERSION#v}
            NEW_NAME="Stoat-Desktop-linux-x64-${VERSION}.zip"
            mv "$ZIP_FILE" "out/make/zip/linux/x64/$NEW_NAME"
            echo "zip_path=out/make/zip/linux/x64/$NEW_NAME" >> $GITHUB_OUTPUT
            echo "zip_name=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "Found ZIP: $ZIP_FILE -> $NEW_NAME"
          else
            echo "ERROR: Expected exactly one ZIP in out/make/zip/linux/x64, found ${#ZIP_FILES[@]}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: stoat-desktop-linux
          path: ${{ steps.find-zip.outputs.zip_path }}
          retention-days: 30

  build-appimage:
    needs: build-linux
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux@sha256:f6fc7e14b0612a355d7ab50efb3cc40010ba28e4766860bd238d313b308f190b

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v7

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: stoat-desktop-linux
          path: /tmp/stoat

      - name: Prepare AppImage container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/9ec9767d6b32dbc95242ffe055ca0833b9964941/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/9ec9767d6b32dbc95242ffe055ca0833b9964941/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/9ec9767d6b32dbc95242ffe055ca0833b9964941/useful-tools/make-aur-package.sh

      - name: Install AppImage dependencies
        run: /bin/sh ./.github/build/appimage/get-dependencies.sh

      - name: Extract Linux package
        run: /bin/sh ./.github/build/appimage/extract-artifact.sh
        env:
          BUILD_VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Install pinned AppImage tools
        run: |
          wget -O /tmp/appimagetool https://github.com/pkgforge-dev/appimagetool/releases/download/0.3.3/appimagetool-x86_64-linux
          echo "0d01a4e2628efc897be9663f0faeed6a171e1851270b4e1ce4c22434a36ecebd  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
          wget -O /tmp/sharun https://github.com/pkgforge-dev/Anylinux-sharun/releases/download/2.2.5/sharun-x86_64
          echo "8714860e67c47f57d16248260cc6c333a7baa5741bc6d0f6645ab4cbab4b314a  /tmp/sharun" | sha256sum -c -
          chmod +x /tmp/sharun
          wget -O /tmp/mkdwarfs https://github.com/mhx/dwarfs/releases/download/v0.15.6/dwarfs-universal-0.15.6-Linux-x86_64
          echo "50891c38ba359db8271819a6cbf6aaa8068681523f0c4f2b8242007a45edaa28  /tmp/mkdwarfs" | sha256sum -c -
          chmod +x /tmp/mkdwarfs
          wget -O /tmp/uruntime https://github.com/VHSgunzo/uruntime/releases/download/v0.5.9/uruntime-appimage-dwarfs-lite-x86_64
          echo "cef962c299f2fa19b2b3cdf2fa1565ee8541796cc89b9a97a591f94041e8b083  /tmp/uruntime" | sha256sum -c -
          chmod +x /tmp/uruntime

      - name: Build and test AppImage
        run: /bin/sh ./.github/build/appimage/make-appimage.sh
        env:
          ANYLINUX_LIB_SOURCE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/9ec9767d6b32dbc95242ffe055ca0833b9964941/useful-tools/lib/anylinux.c
          APPIMAGETOOL: /tmp/appimagetool
          DWARFS_CMD: /tmp/mkdwarfs
          GTK_CLASS_FIX_SOURCE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/9ec9767d6b32dbc95242ffe055ca0833b9964941/useful-tools/lib/gtk-class-fix.c
          HOOKSRC: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/9ec9767d6b32dbc95242ffe055ca0833b9964941/useful-tools/hooks
          RUNTIME: /tmp/uruntime
          SHARUN_PATH: /tmp/sharun

      - name: Validate AppImage artifacts
        run: |
          set -eu
          set -- dist/*.AppImage
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one AppImage" >&2; exit 1; }
          set -- dist/*.AppImage.zsync
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected exactly one AppImage zsync file" >&2; exit 1; }

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stoat-desktop-appimage
          path: dist/*.AppImage*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: validate-release
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull desktop assets
        run: |
          # Pull Stoat brand assets for desktop app (submodule with update=none)
          git -c submodule."assets".update=checkout submodule update --init assets

      - name: Checkout client repo
        if: ${{ !env.ACT }}
        uses: actions/checkout@v7
        with:
          repository: Trifall/stoat-for-web
          path: client
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check client directory exists
        shell: pwsh
        run: |
          if (-Not (Test-Path "client")) {
            Write-Error "ERROR: client/ directory not found. For local testing with act, ensure client/ exists. Run: git clone https://github.com/Trifall/stoat-for-web client"
            exit 1
          }
          Write-Host "client/ directory found"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js for web client
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          working_directory: client

      - name: Clean old builds
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force client/packages/client/dist, client/packages/client/dist-prod, client/packages/stoat.js/dist, client/packages/solid-livekit-components/dist -ErrorAction SilentlyContinue

      - name: Install dependencies (Client)
        working-directory: client
        env:
          npm_config_maxsockets: 1
        run: pnpm install --frozen-lockfile --config.node-linker-isolated=false

      - name: Pull brand assets
        working-directory: client
        run: |
          # Pull Stoat brand assets (submodule with update=none)
          git -c submodule."packages/client/assets".update=checkout submodule update --init packages/client/assets

      - name: Build dependencies
        working-directory: client
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command node
          node --version
          pnpm --version
          mise --version
          # Run the underlying tasks directly. On Windows, mise's nested task
          # process can lose Node from PATH even though this shell resolves it.
          pnpm --filter stoat.js build
          pnpm --filter solid-livekit-components build
          pnpm --filter @lingui-solid/babel-plugin-lingui-macro build
          pnpm --filter @lingui-solid/babel-plugin-extract-messages build

      - name: Copy audio assets
        shell: pwsh
        run: |
          if (Test-Path "client/packages/client/scripts/assets_fallback/audio") {
            New-Item -ItemType Directory -Force -Path "client/packages/client/assets/audio"
            Copy-Item -Recurse -Force "client/packages/client/scripts/assets_fallback/audio/*" "client/packages/client/assets/audio/"
            Write-Host "Audio assets copied"
            Set-Location client/packages/client
            node scripts/copyAssets.mjs
            Set-Location ../../..
          }

      - name: Process translations
        working-directory: client
        run: |
          # Compile lingui messages after lingui packages are built
          pnpm --filter client exec lingui extract
          pnpm --filter client exec lingui compile --typescript

      - name: Build web client
        working-directory: client
        env:
          VITE_CFG_ENABLE_VIDEO: "true"
          VITE_RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          pnpm --filter client exec node scripts/copyAssets.mjs
          pnpm --filter client exec vite build

      - name: Copy web assets to desktop
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force web-dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path web-dist
          Copy-Item -Recurse -Force client/packages/client/dist/* web-dist/

      - name: Setup Node.js for Electron Forge
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MinGW (for keyspy)
        run: choco install mingw -y

      - name: Clear desktop build output
        run: Remove-Item -Recurse -Force .vite, out/Stoat-win32-x64, out/make/zip/win32/x64 -ErrorAction SilentlyContinue

      - name: Build desktop app
        run: pnpm package --platform=win32 --arch=x64

      - name: Create distributable ZIP
        run: pnpm make --platform=win32 --arch=x64 --targets=zip --skip-package

      - name: Find ZIP file
        id: find-zip
        shell: pwsh
        run: |
          $zipFiles = @(Get-ChildItem -Path "out/make/zip/win32/x64" -Filter "*.zip" -File -ErrorAction SilentlyContinue)
          if ($zipFiles.Count -eq 1) {
            $zipFile = $zipFiles[0]
            $inputVersion = "${{ github.event.inputs.version }}"
            $version = if ($inputVersion) { $inputVersion } else { $env:GITHUB_REF_NAME }
            $version = $version -replace '^v', ''
            $newName = "Stoat-Desktop-win32-x64-$version.zip"
            Move-Item $zipFile.FullName "out/make/zip/win32/x64/$newName"
            echo "zip_path=out/make/zip/win32/x64/$newName" >> $env:GITHUB_OUTPUT
            echo "zip_name=$newName" >> $env:GITHUB_OUTPUT
            Write-Host "Found ZIP: $($zipFile.FullName) -> $newName"
          } else {
            Write-Error "ERROR: Expected exactly one ZIP in out/make/zip/win32/x64, found $($zipFiles.Count)"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: stoat-desktop-windows
          path: ${{ steps.find-zip.outputs.zip_path }}
          retention-days: 30

  create-release:
    needs: [build-linux, build-appimage, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.inputs.version, 'v')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for git log + tag history

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: stoat-desktop-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: stoat-desktop-windows
          path: artifacts

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          name: stoat-desktop-appimage
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts

      - name: Generate changelog
        id: changelog
        run: |
          RELEASE_TAG="${{ github.event.inputs.version || github.ref_name }}"
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || echo "")
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          fi

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          cat > changelog.txt << 'EOF'
          ## Downloads
          - **Windows**: Extract the entire Windows ZIP into a new empty folder and run `stoat-desktop.exe`.
          - **Linux**: Extract the entire Linux ZIP into a new empty folder and run `./stoat-desktop`.
          - **Linux AppImage**: Make the AppImage executable and run it directly. The `.zsync` file supports compatible AppImage update tools.

          Do not copy only the executable over an older install. The bundled client is stored in `resources/web-dist` and must remain beside the application files.

          ## Requirements (Linux)
          - X11 or XWayland for full functionality
          - libx11, libxtst, libxt, libxinerama packages

          ## Changelog
          EOF
          echo "$CHANGELOG" >> changelog.txt
          echo "changelog_file=changelog.txt" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Stoat Desktop ${{ github.event.inputs.version || github.ref_name }}
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
